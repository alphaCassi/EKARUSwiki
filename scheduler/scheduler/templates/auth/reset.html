{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block title %}New password{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Choose a new password</h1>
  <form method="post" class="form card">
    {{ csrf() }}
    <label class="field">New password <span class="hint">At least 10 characters</span>
      <input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label class="field">Repeat password <input name="password2" type="password" autocomplete="new-password" minlength="10" required></label>
    <button class="btn" type="submit">Save password</button>
  </form>
</div>
{% endblock %}
