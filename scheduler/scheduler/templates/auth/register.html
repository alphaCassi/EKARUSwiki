{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Create an account</h1>
  <p class="lede">You need an account to submit observing proposals. We'll send a link to confirm your e-mail.</p>
  <form method="post" class="form card">
    {{ csrf() }}
    <label class="field">Name <input name="name" value="{{ form.name }}" autocomplete="name" required></label>
    <label class="field">E-mail <input name="email" type="email" value="{{ form.email }}" autocomplete="email" required></label>
    <label class="field">Institute <input name="institute" value="{{ form.institute }}" autocomplete="organization"></label>
    <label class="field">Password <span class="hint">At least 10 characters</span>
      <input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label class="field">Repeat password <input name="password2" type="password" autocomplete="new-password" minlength="10" required></label>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
