# nginx site — HTTPS in front of gunicorn. Certificates e.g. from Let's Encrypt (certbot).
server {
    listen 443 ssl;
    server_name ekaruswiki.example.org;

    ssl_certificate     /etc/letsencrypt/live/ekaruswiki.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekaruswiki.example.org/privkey.pem;

    # static files served directly, cached for a week
    location /static/ {
        alias /opt/ekaruswiki-server/ekaruswiki/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name ekaruswiki.example.org;
    return 301 https://$host$request_uri;
}
