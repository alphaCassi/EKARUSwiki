{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block section %}Account{% endblock %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Your profile</h1>
  <form method="post" class="form card">
    {{ csrf() }}
    {% set nm = split_name(g.user.name) %}
    <div class="row">
      <label class="field grow">First name <input name="first_name" value="{{ nm[0] }}" autocomplete="given-name" maxlength="60" required></label>
      <label class="field grow">Surname <input name="last_name" value="{{ nm[1] }}" autocomplete="family-name" maxlength="60" required></label>
    </div>
    <label class="field">E-mail <input value="{{ g.user.email }}" disabled></label>
    <label class="field">Institute <input name="institute" value="{{ g.user.institute }}" autocomplete="organization"></label>
    <button class="btn" type="submit">Save profile</button>
  </form>
  <p><a href="{{ url_for('accounts.forgot') }}">Change password</a></p>
</div>
{% endblock %}
