{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Sign in</h1>
  <form method="post" action="{{ url_for('accounts.team_signin') }}" class="form card">
    {{ csrf() }}
    <div class="trap" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <h2>EKARUS team</h2>
    <label class="field">Your e-mail <input name="email" type="email" value="{{ email }}" autocomplete="email" required></label>
    <button class="btn" type="submit">Sign in</button>
  </form>
  <form method="post" class="form card">
    {{ csrf() }}
    <div class="trap" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <h2>Observers</h2>
    <label class="field">E-mail <input name="email" type="email" value="{{ email }}" autocomplete="email" required></label>
    <label class="field">Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-secondary" type="submit">Sign in</button>
    <p class="small"><a href="{{ url_for('accounts.forgot') }}">Forgot your password?</a> No account yet? <a href="{{ url_for('accounts.register') }}">Register as an observer</a></p>
  </form>
</div>
{% endblock %}
